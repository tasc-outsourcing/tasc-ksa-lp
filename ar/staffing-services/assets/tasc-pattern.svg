<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000" role="img" aria-label="TASC secondary graphic">
  

  <defs>
    <!-- The gradient is baked into the icon's own bounding box, so it rotates
         with each petal exactly as it does in the master artwork. -->
    <linearGradient id="tascPetalGradient" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#45DB33"/>
    </linearGradient>

    <!-- One chevron: apex on the ring at radius 200, body radiating outward. -->
    <polygon id="tascPetal"
      points="609.5,0 1219,1000 899,1000 609.5,525.5 320.3,1000 0,1000"
      transform="translate(-170.66, 200) scale(0.28)"/>
  </defs>

  <!-- Clockwise from 6 o'clock: gradient, blue, yellow, gradient, blue, yellow.
       Each colour appears twice, diametrically opposite its twin. -->
  <use href="#tascPetal" transform="rotate(0)"   fill="url(#tascPetalGradient)"/>
  <use href="#tascPetal" transform="rotate(60)"  fill="#005F83"/>
  <use href="#tascPetal" transform="rotate(120)" fill="#FFD100"/>
  <use href="#tascPetal" transform="rotate(180)" fill="url(#tascPetalGradient)"/>
  <use href="#tascPetal" transform="rotate(240)" fill="#005F83"/>
  <use href="#tascPetal" transform="rotate(300)" fill="#FFD100"/>
</svg>
